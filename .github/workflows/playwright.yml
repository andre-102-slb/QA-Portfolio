name: Playwright Tests
run-name: ${{ github.event.inputs.run_name || 'Playwright Tests' }}

on:
  workflow_dispatch:
    inputs:
      test_paths:
        description: Test paths (space-separated)
        type: string
      retries:
        description: Retries on failure (0 or 2)
        default: "0"
        type: string
      run_name:
        description: Custom run name (shown in dashboard)
        default: ""
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BLOCKED_USERNAME: ${{ secrets.BLOCKED_USERNAME }}
      VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}
      VALID_USERNAME: ${{ secrets.VALID_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: npm install

      - run: npx playwright install-deps chromium && npx playwright install chromium

      - name: Run tests
        run: >
          npx playwright test
          ${{ github.event.inputs.test_paths }}
          --project=chromium
          --retries=${{ github.event.inputs.retries || 0 }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
