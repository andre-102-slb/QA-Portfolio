name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      test_paths:
        description: "Test paths (space-separated)"
        required: false
        default: "frontend-tests/smoke/login frontend-tests/regression/login"
        type: string
      retries:
        description: "Retries on failure (0 or 2)"
        required: false
        default: "0"
        type: string

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: |
          RETRIES="${{ github.event.inputs.retries }}"
          if [ -z "$RETRIES" ]; then RETRIES=0; fi

          if [ -n "${{ github.event.inputs.test_paths }}" ]; then
            npx playwright test ${{ github.event.inputs.test_paths }} --retries="$RETRIES"
          else
            npx playwright test --retries="$RETRIES"
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-results
          path: test-results/results.json
          retention-days: 30
